name: Embedding memory regression
on:
  push:
    paths:
      - ai/rag.py
      - ai/embedding_cache.py
      - tests/test_embedding_memory.py
      - tools/benchmark_embedding_memory.py
      - .github/workflows/memory-regression.yml
  pull_request:
    paths:
      - ai/rag.py
      - ai/embedding_cache.py
      - tests/test_embedding_memory.py
      - tools/benchmark_embedding_memory.py
      - .github/workflows/memory-regression.yml
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify backwards compatibility and exact search scores offline
        run: python3 tests/test_embedding_memory.py
      - name: Verify memory budget and exact float values
        run: python3 tools/benchmark_embedding_memory.py > embedding-memory.json
      - uses: actions/upload-artifact@v4
        with:
          name: embedding-memory
          path: embedding-memory.json
